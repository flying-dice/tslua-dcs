name: Lerna Workflow

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Lua and LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install lua5.1
          sudo apt-get install luarocks
      - name: Install LuaSocket
        run: sudo luarocks install luasocket
      - run: npm ci
      - run: npm test
      - run: npm run test:lua
      - run: npm run audit:dcs-types -- --strict
      - run: npm run typecheck:export --workspace=@flying-dice/tslua-dcs-mission-types
      - run: npm run typecheck:export --workspace=@flying-dice/tslua-dcs-gui-types
      - run: npm run test:export --workspace=@flying-dice/tslua-dcs-mission-types
      - run: npm run test:export --workspace=@flying-dice/tslua-dcs-gui-types

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set Git Config
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)"
          git config user.email "$(git log -n 1 --pretty=format:%ae)"
      - run: npm run publish
        env:
          NPM_TOKEN: ${{secrets.NPM_TOKEN}}

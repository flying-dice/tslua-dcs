name: Lerna Workflow

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Every Lua script runs on the repo-managed interpreter (packages/tslua-lua51),
      # so no system Lua/LuaRocks/LuaSocket is installed. Keep this version in
      # step with packages/tslua-lua51/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/tslua-lua51
      - run: npm ci
      # Regression: the DCS bridge must build from a clean checkout (before anything else builds).
      - run: npm run dcs:build
      - run: npm test
      - run: npm run test:lua
      - run: npm run audit:dcs-types -- --strict
      - run: npm run typecheck:export --workspace=@flying-dice/tslua-dcs-mission-types
      - run: npm run typecheck:export --workspace=@flying-dice/tslua-dcs-gui-types
      - run: npm run test:export --workspace=@flying-dice/tslua-dcs-mission-types
      - run: npm run test:export --workspace=@flying-dice/tslua-dcs-gui-types

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set Git Config
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)"
          git config user.email "$(git log -n 1 --pretty=format:%ae)"
      - run: npm run publish
        env:
          NPM_TOKEN: ${{secrets.NPM_TOKEN}}
